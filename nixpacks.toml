providers = ["php"]

[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nginx", "gettext"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist"
]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache",
  "chmod -R 775 storage bootstrap/cache"
]

[start]
cmd = "php artisan migrate --force && envsubst '${PORT}' < /app/nginx.conf > /app/nginx.rendered.conf && php-fpm -D && nginx -c /app/nginx.rendered.conf"
